name: Bazel Dependency Violations
permissions:
  contents: read
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # Trigger on `closed` so the concurrency group cancels any in-progress
      # `synchronize` run when a PR is closed or merged by Copybara.
      - closed
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-violations:
    # Skip job execution on `closed` events; the run only exists to cancel
    # in-progress runs in the same concurrency group.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    strategy:
      matrix:
        tag: [gpu, cuda-only, rocm-only]
    name: no-${{ matrix.tag }}-targets-in-cpu-build
    runs-on: "linux-x86-n4-16"
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest" # zizmor: ignore[unpinned-images]
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Check if build or configuration files changed"
        if: github.event_name == 'pull_request'
        id: check_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # `actions/checkout` defaults to `fetch-depth: 1` (only the PR merge
          # commit), so the PR's base commit (`$BASE_SHA`) is not present in the
          # local git object database. Fetch that single commit if missing so we
          # can diff against it.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          CHANGED_BUILD_FILES=$(git diff --name-only "$BASE_SHA" HEAD |
            grep -E '(^|/)(BUILD(\.bazel)?|WORKSPACE(\.bzlmod)?|MODULE\.bazel(\.lock)?|.*\.bzl|.*\.bazelrc)$' || true)
          if [ -z "$CHANGED_BUILD_FILES" ]; then
            echo "No BUILD, .bzl, WORKSPACE, MODULE.bazel, or .bazelrc files changed; skipping dependency violation cquery."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Modified build/config files:"
            echo "$CHANGED_BUILD_FILES"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "Run bazel cquery ... //xla/..."
        if: github.event_name != 'pull_request' || steps.check_changes.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          TAG_WITH_UNDERSCORES="${{ matrix.tag }}"
          TAG_WITH_UNDERSCORES="${TAG_WITH_UNDERSCORES/-/_}"
          if ! OUTPUT=$(bazel cquery --aspects "build_tools/dependencies/aspects.bzl%validate_${TAG_WITH_UNDERSCORES}_tag" //xla/... 2>&1); then
            echo "Failed to run bazel cquery. Output:"
            echo "$OUTPUT"
            exit 1
          fi
          if echo "$OUTPUT" | grep 'Violation' >/dev/null; then
            echo "The following dependency violations were found:"
            echo "$OUTPUT" | grep 'Violation' | sed -e 's/^.*\[Violation\]/ -/'
            echo ""
            echo ""
            echo "There are a couple of potential solutions for this/these violation(s):"
            echo ""
            echo "1. Tag the dependent target with the same tag as the dependee."
            echo ""
            echo "2. If unavoidable make the dependency selective using the"
            echo "   'if_{gpu|cuda|rocm}_is_configured' macro. This is discouraged"
            echo "   outside of stream_executor."
            echo ""
            exit 1
          fi

          echo "No dependency violations found for tag '${{ matrix.tag }}'."
