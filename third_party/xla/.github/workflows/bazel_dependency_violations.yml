name: Bazel Dependency Violations
permissions:
  contents: read
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # Trigger on `closed` so the concurrency group cancels any in-progress
      # `synchronize` run when a PR is closed or merged by Copybara.
      - closed
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-violations:
    # Skip job execution on `closed` events; the run only exists to cancel
    # in-progress runs in the same concurrency group.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    strategy:
      matrix:
        include:
          - name: no-gpu-targets-in-cpu-build
            config: ""
            check_gpu: true
            check_cuda_only: true
            check_rocm_only: true
          - name: no-rocm-only-targets-in-cuda-build
            config: "cuda_clang"
            check_gpu: false
            check_cuda_only: false
            check_rocm_only: true
          - name: no-cuda-only-targets-in-rocm-build
            config: "rocm_clang_hermetic"
            check_gpu: false
            check_cuda_only: true
            check_rocm_only: false
    name: ${{ matrix.name }}
    runs-on: "linux-x86-n4-16"
    container:
      image: "us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest" # zizmor: ignore[unpinned-images]
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - name: "Checking out repository"
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Check if build or configuration files changed"
        if: github.event_name == 'pull_request'
        id: check_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # `actions/checkout` defaults to `fetch-depth: 1` (only the PR merge
          # commit), so the PR's base commit (`$BASE_SHA`) is not present in the
          # local git object database. Fetch that single commit if missing so we
          # can diff against it.
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          CHANGED_BUILD_FILES=$(git diff --name-only "$BASE_SHA" HEAD |
            grep -E '(^|/)(BUILD(\.bazel)?|WORKSPACE(\.bzlmod)?|MODULE\.bazel(\.lock)?|.*\.bzl|.*\.bazelrc)$|^build_tools/dependencies/|^\.github/workflows/bazel_dependency_violations\.yml$' || true)
          if [ -z "$CHANGED_BUILD_FILES" ]; then
            echo "No BUILD, .bzl, WORKSPACE, MODULE.bazel, or .bazelrc files changed; skipping dependency violation cquery."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Modified build/config files:"
            echo "$CHANGED_BUILD_FILES"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: "Check no 'gpu' targets"
        if: >-
          !cancelled() &&
          steps.checkout.outcome == 'success' &&
          matrix.check_gpu &&
          (github.event_name != 'pull_request' || steps.check_changes.outputs.should_run == 'true')
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
        run: bash ./build_tools/dependencies/check_dependency_violations.sh gpu
      - name: "Check no 'cuda-only' targets"
        if: >-
          !cancelled() &&
          steps.checkout.outcome == 'success' &&
          matrix.check_cuda_only &&
          (github.event_name != 'pull_request' || steps.check_changes.outputs.should_run == 'true')
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
        run: bash ./build_tools/dependencies/check_dependency_violations.sh cuda-only
      - name: "Check no 'rocm-only' targets"
        if: >-
          !cancelled() &&
          steps.checkout.outcome == 'success' &&
          matrix.check_rocm_only &&
          (github.event_name != 'pull_request' || steps.check_changes.outputs.should_run == 'true')
        env:
          BAZEL_CONFIG: ${{ matrix.config }}
        run: bash ./build_tools/dependencies/check_dependency_violations.sh rocm-only
