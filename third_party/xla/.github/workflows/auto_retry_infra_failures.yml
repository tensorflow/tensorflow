name: Auto-Retry Transient Infra Failures

on:
  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows:
      - "Bazel Dependency Violations"
      - "Bazel Query"
      - "Bazel Tags"
      - "Clang Tidy"
      - "CI"
      - "Multi-Device CI"
      - "CI ROCm"
    types:
      - completed

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  evaluate-and-retry:
    name: Evaluate and Retry Failed Jobs
    runs-on: ubuntu-latest
    if: |
      github.repository == 'openxla/xla' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    timeout-minutes: 10
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Evaluate failures and retry"
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          python3 .github/workflows/retry_infra_failures.py \
            --repo "$REPO" \
            --run-id "$WORKFLOW_RUN_ID" \
            --max-attempts 2 \
            --cooldown-seconds 15
