name: Buildifier
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  buildifier-lint:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 6
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Run buildifier"
        run: ./build_tools/ci/run_buildifier.sh
