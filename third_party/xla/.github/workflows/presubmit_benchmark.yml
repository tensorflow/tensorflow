# .github/workflows/presubmit_benchmark.yml
name: Presubmit Benchmarks

on:
  workflow_dispatch:
    inputs:
      benchmark_filter:
        description: "Regex to filter by benchmark name (e.g., 'gemma3_.*')."
        required: false
        type: string
        default: ""
      environment_filter:
        description: "Regex to filter by environment configuration ID (e.g., 'gpu_.*')."
        required: false
        type: string
        default: ""

  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/presubmit_benchmark.yml'
      - 'xla/tools/benchmarks/**'
      - 'xla/tools/multihost_hlo_runner/**'
      - 'xla/service/gpu/**'
      - 'xla/backends/gpu/**'
      - 'xla/stream_executor/cuda/**'
      - 'xla/stream_executor/gpu/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  # Scope to the PR head ref so a new push cancels in-flight presubmit runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run_benchmarks:
    name: Run XLA Presubmit Benchmarks
    uses: google-ml-infra/bap/.github/workflows/run-benchmarks.yaml@aabe067ccf0612e9fe5dfb280176df43b12babf9
    with:
      registry_file: "xla/tools/benchmarks/benchmark_registry.pbtxt"
      tag_filter: "presubmit"
      bap_ref: "aabe067ccf0612e9fe5dfb280176df43b12babf9"
      runner: "linux-x86-n4-16"
      publish_metrics: false
      benchmark_filter: ${{ inputs.benchmark_filter || '' }}
      environment_filter: ${{ inputs.environment_filter || '' }}
