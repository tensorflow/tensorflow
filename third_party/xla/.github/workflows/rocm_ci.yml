name: CI ROCm
permissions:
  contents: read
  packages: read
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      # Trigger on `closed` so the concurrency group cancels any in-progress
      # `synchronize` run when a PR is closed or merged by Copybara.
      - closed
  workflow_dispatch:
  workflow_call:
    inputs:
      rocm_xla_branch:
        description: 'Branch name to fetch ROCm XLA scripts from'
        required: false
        default: 'rocm-dev-infra'
        type: string
      runner_label:
        description: 'Runner label for GPU jobs'
        required: false
        default: 'amd-do-linux-xla-gpu-gfx950-dpx-1'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'main' }}

env:
  ROCM_DISTRO_URL: https://stable.repo.amd.com/rocm/core/tarball/therock-dist-linux-multiarch-10.0.0.tar.gz
  ROCM_DISTRO_HASH: 1c5e807875d26a2470ecc7323daa5b5b9009208a55c3290ac255a909cde15fc6
  ROCM_AMD_GPU_TARGETS: gfx950
  ROCM_SINGLE_GPU_RBE_POOL: linux_x64_gpu

jobs:
  rocm-config:
    # Skip job execution on `closed` events; the run only exists to cancel
    # in-progress runs in the same concurrency group.
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.out.outputs.docker-image }}
      skip-jax: ${{ steps.detect_jax.outputs.should_skip }}
      skip-xla: ${{ steps.detect_xla.outputs.should_skip }}
    steps:
      - id: out
        shell: bash
        run: |
          echo "docker-image=ghcr.io/rocm/jax-build-ubu24.rocmless@sha256:68854ed30b800d3e8c390f6e651721e2bead58830da1c59e1b828354eb8f077f" >> "$GITHUB_OUTPUT"

      - name: Checking out openxla/xla
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Detect Changed Files (JAX)
        id: detect_jax
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          XLA_CI_BAZEL_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          XLA_CI_BAZEL_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XLA_CI_DISABLE_BAZEL_DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
        run: |
          python3 -m build_tools.ci.change_detector \
            --is_jax_build \
            --build_name="JAX Linux x86 AMD Instinct GPU"

      - name: Detect Changed Files (XLA)
        id: detect_xla
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          XLA_CI_BAZEL_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          XLA_CI_BAZEL_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XLA_CI_DISABLE_BAZEL_DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
        run: |
          python3 -m build_tools.ci.change_detector \
            --build_name="XLA Linux x86 AMD Instinct GPU"

  jax:
    needs: rocm-config
    if: ${{ github.event_name != 'pull_request' || github.base_ref == 'main' }}
    name: JAX Linux x86 AMD Instinct GPU
    runs-on: ${{ needs.rocm-config.outputs.skip-jax == 'true' && 'ubuntu-latest' || inputs.runner_label || 'amd-do-linux-xla-gpu-gfx950-dpx-1' }}
    timeout-minutes: 50
    # Remove this once the JAX CI is stable.
    continue-on-error: true
    container: ${{ needs.rocm-config.outputs.skip-jax != 'true' && needs.rocm-config.outputs.docker-image || null }}  # zizmor: ignore[unpinned-images]
    env:
      DOCKER_IMAGE: ${{ needs.rocm-config.outputs.docker-image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checking out openxla/xla
        if: ${{ needs.rocm-config.outputs.skip-jax != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout JAX
        if: ${{ needs.rocm-config.outputs.skip-jax != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jax-ml/jax
          path: jax
          persist-credentials: false

      - name: CPU Info
        if: ${{ needs.rocm-config.outputs.skip-jax != 'true' }}
        run: lscpu

      - name: Run JAX Unit Tests
        if: ${{ needs.rocm-config.outputs.skip-jax != 'true' }}
        timeout-minutes: 45
        working-directory: jax
        run: |
          ./ci/run_bazel_test_rocm_rbe.sh \
            --override_repository=xla="${GITHUB_WORKSPACE}" \
            --override_module=xla="${GITHUB_WORKSPACE}" \
            --config=single_gpu \
            --//jax:build_jaxlib=wheel \
            --//jax:build_jax=true \
            --local_test_jobs=1 \
            --repository_cache=/bazel-repo-cache/repo \
            --action_env=JAX_ENABLE_X64=0 \
            --repo_env=HERMETIC_PYTHON_VERSION=3.14 \
            --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}" \
            --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL="${ROCM_SINGLE_GPU_RBE_POOL}" \
            --jobs=20 \
            --repo_env=ROCM_PATH="" \
            --repo_env=ROCM_DISTRO_URL="${ROCM_DISTRO_URL}" \
            --repo_env=ROCM_DISTRO_HASH="${ROCM_DISTRO_HASH}" \
            --repo_env=TF_ROCM_AMDGPU_TARGETS="${ROCM_AMD_GPU_TARGETS}" \
            --repo_env=SYSROOT_DIST=linux_glibc_2_31 \
            --bes_keywords=jax \
            --bes_keywords=upstream \
            --bes_keywords=gpu \
            --bes_keywords=pull_request \
            --build_event_json_file=jax_build_events.json

      - name: Upload JAX BEP File
        if: ${{ always() && needs.rocm-config.outputs.skip-jax != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jax-bep
          path: jax/jax_build_events.json
          if-no-files-found: warn
  xla:
    needs: rocm-config
    name: XLA Linux x86 AMD Instinct GPU
    runs-on: ${{ needs.rocm-config.outputs.skip-xla == 'true' && 'ubuntu-latest' || inputs.runner_label || 'amd-do-linux-xla-gpu-gfx950-dpx-1' }}
    timeout-minutes: 50
    container: ${{ needs.rocm-config.outputs.skip-xla != 'true' && needs.rocm-config.outputs.docker-image || null }}  # zizmor: ignore[unpinned-images]
    env:
      DOCKER_IMAGE: ${{ needs.rocm-config.outputs.docker-image }}
      # Bazel flags shared by every XLA invocation below: bazel-diff and both
      # test runs. Spliced into the `run:` blocks as plain text, so the
      # `${VAR}` references are expanded by the shell of the step using them.
      ROCM_COMMON_BAZEL_ARGS: >-
        --config=rocm_ci_hermetic
        --config=rocm_rbe_dynamic
        --config=ci_repo_cache
        --repo_env=TF_ROCM_RBE_DOCKER_IMAGE="${DOCKER_IMAGE}"
        --repo_env=ROCM_PATH=""
        --repo_env=ROCM_DISTRO_URL="${ROCM_DISTRO_URL}"
        --repo_env=ROCM_DISTRO_HASH="${ROCM_DISTRO_HASH}"
        --repo_env=TF_ROCM_AMDGPU_TARGETS="${ROCM_AMD_GPU_TARGETS}"
        --repo_env=TF_ROCM_RBE_SINGLE_GPU_POOL="${ROCM_SINGLE_GPU_RBE_POOL}"
    defaults:
      run:
        shell: bash
    steps:
      - name: Checking out openxla/xla
        if: ${{ needs.rocm-config.outputs.skip-xla != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Compute Impacted Targets (bazel-diff)
        id: bazel_diff
        if: ${{ github.event_name == 'pull_request' && needs.rocm-config.outputs.skip-xla != 'true' }}
        env:
          XLA_CI_BAZEL_DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          XLA_CI_BAZEL_DIFF_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          XLA_CI_DISABLE_BAZEL_DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'ci:disable-bazel-diff') }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          python3 -m build_tools.ci.bazel_diff \
            --build_name="XLA Linux x86 AMD Instinct GPU" \
            --use_cquery \
            --bazelrc="build_tools/rocm/rocm_xla_ci.bazelrc" \
            ${{ env.ROCM_COMMON_BAZEL_ARGS }} \
            --config=ci_single_gpu \
            --target_pattern="//xla/..." \
            --output_target_pattern_file="${RUNNER_TEMP:-/tmp}/rocm_impacted_targets.txt"

      - name: CPU Info
        if: ${{ needs.rocm-config.outputs.skip-xla != 'true' && steps.bazel_diff.outputs.should_skip != 'true' }}
        run: lscpu

      - name: Test XLA [single_gpu]
        if: ${{ needs.rocm-config.outputs.skip-xla != 'true' && steps.bazel_diff.outputs.should_skip != 'true' }}
        timeout-minutes: 45
        env:
          XLA_ROCM_TARGET_PATTERN_FILE: ${{ steps.bazel_diff.outputs.target_pattern_file }}
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            ${{ env.ROCM_COMMON_BAZEL_ARGS }} \
            --config=ci_single_gpu \
            --test_env=HSA_CO_DMACOPY_SIZE=-1 \
            --config=no_flaky \
            --local_test_jobs=1 \
            --bes_keywords=xla \
            --bes_keywords=upstream \
            --bes_keywords=gpu \
            --bes_keywords=pull_request \
            --build_event_json_file=xla_single_gpu_build_events.json \
            -- \
            //xla/...

      - name: Test XLA [rocm_cpu]
        if: ${{ needs.rocm-config.outputs.skip-xla != 'true' && steps.bazel_diff.outputs.should_skip != 'true' }}
        timeout-minutes: 30
        env:
          XLA_ROCM_TARGET_PATTERN_FILE: ${{ steps.bazel_diff.outputs.target_pattern_file }}
        run: |
          build_tools/rocm/run_xla_ci_build.sh \
            ${{ env.ROCM_COMMON_BAZEL_ARGS }} \
            --config=ci_rocm_cpu \
            --config=no_flaky \
            --local_test_jobs=200 \
            --test_env=HSA_CO_DMACOPY_SIZE=-1 \
            --bes_keywords=xla \
            --bes_keywords=upstream \
            --bes_keywords=cpu \
            --bes_keywords=pull_request \
            --build_event_json_file=xla_rocm_cpu_build_events.json \
            -- \
            //xla/...

      - name: Upload XLA BEP Files
        if: ${{ always() && needs.rocm-config.outputs.skip-xla != 'true' && steps.bazel_diff.outputs.should_skip != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xla-bep
          path: |
            xla_single_gpu_build_events.json
            xla_rocm_cpu_build_events.json
          if-no-files-found: warn
