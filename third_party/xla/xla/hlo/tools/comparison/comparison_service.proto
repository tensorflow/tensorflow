edition = "2023";

package xla.numerics.comparison;

import "xla/hlo/tools/comparison/comparison_options.proto";
import "xla/service/hlo.proto";
import "xla/xla_data.proto";

message UploadHloModuleRequest {
  xla.HloModuleProto hlo_module = 1;
  ComparisonOptions.ComparisonVariant comparison_variant = 2;
}

message UploadHloModuleResponse {}

message TensorPosition {
  string instruction_name = 1;
  repeated int64 shape_index = 2;
  // If this instruction is a loop instruction, this is the iteration index.
  // The default value 0 means it's just the first time this instruciton runs,
  // which makes sense for non-loop instructions as well.
  int32 iteration_index = 3;
}

message TensorSummary {
  message TensorSummaryMetadata {
    string hlo_module_name = 1;
    // The position of the tensor in the original HLO module. The last element
    // corresponds to the leaf instruction. The prefix elements represent the
    // scope.
    repeated TensorPosition original_positions = 2;
    ComparisonOptions.ComparisonVariant comparison_variant = 3;
  }

  xla.ShapeProto shape = 1;
  TensorSummaryMetadata metadata = 2;
  float mean = 3;
  float stddev = 4;
  float min = 5;
  float max = 6;
  repeated float samples = 7;
  bytes checksum = 8;
  float non_zero_mean = 9;
  float non_zero_stddev = 10;
}

message ModuleStats {
  int64 num_tensors_recorded = 1;
  int64 num_tensors_with_original_value = 2;
}

message RecordTensorsRequest {
  repeated TensorSummary tensor_summaries = 1;
}

message RecordTensorsResponse {}

message RegisterHloModuleRunRequest {
  int32 logical_device_id = 1;
  uint64 run_id = 2;
  ComparisonOptions.ComparisonVariant comparison_variant = 3;
  string hlo_module_name = 4;
}

message RegisterHloModuleRunResponse {}

message FinishHloModuleRunRequest {
  int32 logical_device_id = 1;
  uint64 run_id = 2;
  ComparisonOptions.ComparisonVariant comparison_variant = 3;
  ModuleStats module_stats = 4;
}

message FinishHloModuleRunResponse {}

service ComparisonService {
  // Uploads an HLO module to the server job.
  rpc UploadHloModule(UploadHloModuleRequest) returns (UploadHloModuleResponse);

  // Registers an HLO module run to the server job.
  rpc RegisterHloModuleRun(RegisterHloModuleRunRequest)
      returns (RegisterHloModuleRunResponse);

  // Uploads tensor summaries to the server job.
  rpc RecordTensors(RecordTensorsRequest) returns (RecordTensorsResponse);

  // Finishes an HLO module run.
  rpc FinishHloModuleRun(FinishHloModuleRunRequest)
      returns (FinishHloModuleRunResponse);
}
