edition = "2023";

package xla.numerics.comparison;

import "xla/xla_data.proto";

// Mirror of internal LaunchInfo proto for OSS compatibility.
message LaunchInfo {
  int64 hlo_module_id = 1;
  string hlo_module_name = 2;
  int32 launch_barrier_id = 3;
  xla.DeviceAssignmentProto device_assignment = 4;
}
