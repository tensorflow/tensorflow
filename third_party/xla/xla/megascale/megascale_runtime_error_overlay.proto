syntax = "proto3";

package xla.megascale.runtime;

import "xla/tsl/protobuf/status.proto";

option java_multiple_files = true;
option java_outer_classname = "Runtime";

enum TpuCoreTypeProto {
  TPU_CORE_TYPE_INVALID = 0;
  TPU_CORE_TYPE_TENSOR_CORE = 1;
  TPU_CORE_TYPE_RESERVED = 2;
  TPU_CORE_TYPE_SPARSE_CORE = 3;
}

// Overlay for xla.megascale.runtime.MegaScaleAction
message MegaScaleActionOverlay {
  message DeviceToHost {
    // Buffer produced as result of D2H transfer will be made available
    // at done_key.
    string done_key = 2;
  }

  message HostToDevice {}

  message NetworkSend {
    message Peer {
      string key = 1;
    }

    message Transfer {
      Peer peer = 3;
    }

    message TransferInfo {
      Transfer transfer = 4;
    }

    // Transfer buffer over network to destinations specified in transfer_info.
    TransferInfo transfer_info = 1;
  }

  message NetworkReceive {
    // Buffer produced as a result of network received with this key will
    // be available at done_key in callback registry.
    string done_key = 1;

    // Expected size of the buffer.
    int64 buffer_size = 2;
  }

  message Compute {}

  // An input can be either a valid buffer to represent data dependency or a
  // void buffer to indicate control dependency.
  message Input {
    // Index of action in MegaScaleActionGraph.actions that produces this
    // buffer.
    int32 action_index = 1;
  }

  oneof action {
    DeviceToHost device_to_host = 1;
    HostToDevice host_to_device = 2;
    NetworkSend network_send = 3;
    NetworkReceive network_receive = 4;
    Compute compute = 5;
  }

  // List of inputs. Action is executed once all its inputs are available and
  // any run_after actions are done.
  repeated Input inputs = 6;

  // Index of this action in the graph. Mainly for debugging.
  int32 index = 8;
}

// Overlay for xla.megascale.runtime.MegaScaleActionGraph
message MegaScaleActionGraphOverlay {
  // Unique identifier for this graph. Typically this is set to unique
  // identifiers generated by XLA compiler.
  string id = 1;

  // All actions that belong to this Graph. Actions are executed once all their
  // inputs are available (generated by predecessor actions) and any run_after
  // actions are done. See MegaScaleAction for more details. The index of
  // actions is referred to by dependent actions.
  repeated MegaScaleActionOverlay actions = 2;

  // The HLO module name corresponding to the send op that triggered this graph.
  string hlo_module = 7;

  reserved 11, 12, 13;
}

// Overlay for xla.megascale.runtime.ExecutorTelemetry
message ExecutorTelemetryOverlay {
  message PendingGraphState {
    MegaScaleActionGraphOverlay graph = 1;
    int32 launch_id = 2;
    repeated int32 completed_actions = 3;
    repeated int32 pending_actions = 4;
    reserved 5;
    repeated int32 active_actions = 6;
  }

  repeated PendingGraphState pending_graphs = 1;
  reserved 2;
}

// Overlay for xla.megascale.runtime.ProgramRunInfo
message ProgramRunInfoOverlay {
  // run_id is only relevant within a TPU and shouldn't be compared across TPUs.
  uint64 run_id = 1;
  // launch_id should be consistent across TPUs running the same execution.
  // (within and across slices)
  int32 launch_id = 2;
  // The name of the HLO module/program.
  string name = 3;
  // We store the fingerprint (as a hex string) just in case there are different
  // modules that happen to have the same module_name, which generally shouldn't
  // happen.
  string fingerprint = 4;
}

// Overlay for xla.megascale.runtime.TpuCoreHLO
message TpuCoreHLOOverlay {
  // Chip ID local to the slice.
  int32 chip_id = 1;
  // Core index within its chip.
  int32 core_idx = 2;
  // Full HLO details.
  string hlo = 3;
  // Fingerprint of the running executable.
  string executable_fingerprint = 4;
  reserved 5;
  // Current program counter
  optional int64 pc = 6;
  // Tag information to be used with PC
  optional int64 tag = 7;
  string hostname = 8;
  // Short name of the HLO.
  string hlo_name = 9;
  // Module name of the running executable.
  string module_name = 10;
  reserved 11;
  // Launch ID of the running executable.
  int32 launch_id = 12;
  // The type of the TPU core.
  TpuCoreTypeProto tpu_core_type = 13;
  // Short name of the computation where the HLO resides in.
  string computation_name = 15;
  // Basic debug info about recently completed programs runs. Sorted in reverse
  // chronological order. (the first entry is the most recently completed run)
  repeated ProgramRunInfoOverlay recent_completions = 16;
  reserved 17;
  // True if the TPU is running a program actively.
  optional bool active = 18;
  // The error when obtaining the TPU core information.
  repeated tensorflow.StatusProto errors = 19;
}

// Overlay for xla.megascale.runtime.RapidEyeInfo
message RapidEyeInfoOverlay {
  ExecutorTelemetryOverlay telemetry = 1;

  repeated TpuCoreHLOOverlay tpu_core_hlos = 2;

  // Whether the RapidEyeInfo was truncated due to exceeding the size limit.
  bool is_truncated = 3;

  // The number of slices, tasks per slice, local slice ID and task ID that are
  // obtained from the workers' last used topology. This is useful for the error
  // aggregator to determine if all error messages have been received.
  int64 num_slices = 4;
  int64 num_tasks_per_slice = 5;
  int32 slice_id = 6;
  int32 task_id = 7;

  // The incarnation ID for the workload shared across all workers. This will
  // reset every time the workload restart.
  int64 incarnation_id = 8;

  // Specifies the TPU platform type.
  int32 tpu_version = 9;
  string chip_config_name = 10;

  reserved 11;
}

// Overlay for xla.megascale.runtime.RuntimeStateSummary
message RuntimeStateSummaryOverlay {
  // RapidEye info.
  RapidEyeInfoOverlay rapid_eye_info = 4;

  reserved 1, 2, 3;
}

// Overlay for xla.megascale.runtime.MegaScaleRuntimeError
message MegaScaleRuntimeErrorOverlay {
  enum ErrorType {
    NO_ERROR = 0;
    HANG_DETECTED = 1;
    UNRECOVERABLE_ERROR = 2;
    CANCELLED = 3;
  }

  // How the hang error is detected.
  enum HangErrorType {
    // The default value. This indicates that the hang error type is not
    // specified.
    HANG_ERROR_UNSPECIFIED = 0;
    // The hang error type is caused by a megascale timeout.
    TIMEOUT_ERROR = 1;
    // The hang error type is caused by no progress being made on all registered
    // metrics like rpc, pjrt, etc.
    NO_PROGRESS_ERROR = 2;
  }

  enum UnrecoverableErrorType {
    UNRECOVERABLE_ERROR_UNCLASSIFIED = 0;
    HOST_TO_DEVICE_ERROR = 1;
    DEVICE_TO_HOST_ERROR = 2;
  }

  ErrorType error_type = 1;
  string error_message = 2;
  uint64 estimated_start_time_ms = 3;
  RuntimeStateSummaryOverlay runtime_state = 4;
  int32 triggering_launch_id = 5;
  string hostname = 6;
  string user = 7;
  string job_name = 8;
  int32 task_id = 9;
  int64 task_uid = 10;
  fixed64 event_id = 11;
  UnrecoverableErrorType unrecoverable_error_type = 12;
  fixed64 runtime_error_id = 13;
  HangErrorType hang_error_type = 14;
}
