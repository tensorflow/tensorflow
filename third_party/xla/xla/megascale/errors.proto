edition = "2023";

package xla.megascale.runtime;

import "xla/megascale/debug_logging.proto";

option features.field_presence = IMPLICIT;

message RuntimeStateSummary {
  // RapidEye info.
  RapidEyeInfo rapid_eye_info = 4;

  reserved 1, 2, 3;
}

// Next ID: 15
message MegaScaleRuntimeError {
  enum ErrorType {
    NO_ERROR = 0;

    // HANG_DETECTED is set when there is no error detected, but expected
    // transfers required for completion of a step have not been received
    // for order of minutes. This is usually a terminal (irrecoverable)
    // condition, but can be transient due to scheduling skew of corresponding
    // steps on slices.
    HANG_DETECTED = 1;

    // An explicit error was encountered which cannot be retried. e.g. network
    // transmission failed after all retries exhausted.
    UNRECOVERABLE_ERROR = 2;

    // The execution was cancelled.
    CANCELLED = 3;
  }

  // How the hang error is detected.
  enum HangErrorType {
    // The default value. This indicates that the hang error type is not
    // specified.
    HANG_ERROR_UNSPECIFIED = 0;
    // The hang error type is caused by a megascale timeout.
    TIMEOUT_ERROR = 1;
    // The hang error type is caused by no progress being made on all registered
    // metrics like rpc, pjrt, etc.
    NO_PROGRESS_ERROR = 2;
  }

  enum UnrecoverableErrorType {
    UNRECOVERABLE_ERROR_UNCLASSIFIED = 0;

    // An error encountered during host to device transfers that cannot be
    // retried.
    HOST_TO_DEVICE_ERROR = 1;

    // An error encountered during device to host transfers that cannot be
    // retried.
    DEVICE_TO_HOST_ERROR = 2;
  }

  ErrorType error_type = 1;
  UnrecoverableErrorType unrecoverable_error_type = 12;
  HangErrorType hang_error_type = 14;
  string error_message = 2;

  // estimated_start_time_ms is an estimate of when the error event started.
  uint64 estimated_start_time_ms = 3;

  // The launch_id that triggered this error.
  int32 triggering_launch_id = 5 [features.field_presence = EXPLICIT];

  // The hostname of the worker that reports this error.
  string hostname = 6;

  // The task information of the worker that reports this error.
  //
  // TODO: b/412421960 - These information is only set in Borg environment
  // currently. Will be available on Cloud once we settle down on what API for
  // retrieving the job information.
  string user = 7;
  string job_name = 8;
  int32 task_id = 9;
  // The task *attempt* UID assigned by the Borgmaster.
  int64 task_uid = 10;

  RuntimeStateSummary runtime_state = 4;

  // The event ID of the error. This event_id is propagated from the error
  // digest generated by RapidEye, and all runtime errors with the same
  // event_id are considered to be part of the same incident.
  fixed64 event_id = 11;

  // The unique runtime error ID of the error. All runtime errors of the same
  // incident will have their unique runtime error ID. And error digest should
  // contain all runtime error IDs that are part of the incident.
  fixed64 runtime_error_id = 13;
}
