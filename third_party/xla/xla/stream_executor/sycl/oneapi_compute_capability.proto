syntax = "proto3";

package stream_executor;

option java_outer_classname = "OneAPIComputeCapability";
option java_multiple_files = true;

message OneAPIComputeCapabilityProto {
  string architecture = 1;
  reserved 2;
  reserved "variant";
  // Xe generation of the device. Always written when known, but only read when
  // `architecture` is not a known Xe architecture, to tell apart devices from
  // different unknown generations.
  optional uint32 generation = 3;
}
