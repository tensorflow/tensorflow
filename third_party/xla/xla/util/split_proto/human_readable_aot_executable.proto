syntax = "proto3";

package xla;

import "xla/pjrt/proto/compile_options.proto";
import "xla/service/gpu/gpu_executable.proto";

option java_outer_classname = "HumanReadableAotExecutableProto";
option java_multiple_files = true;

// An AOT binary consists of an ExecutableAndOptionsProto with a serialized
// GpuExecutableProto stored in the `serialized_executable` field of the
// options.
//
// This proto combines both into a single proto, allowing the whole binary to
// be inspected, edited, or stored in a single human-readable format.
message HumanReadableAotExecutable {
  // The serialized_executable field of this proto is not populated.
  ExecutableAndOptionsProto executable_and_options = 1;
  gpu.GpuExecutableProto gpu_executable = 2;
}
