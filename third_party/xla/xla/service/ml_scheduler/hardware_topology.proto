syntax = "proto3";

package xla.ml_scheduler;

// Describes the target hardware environment and topology.
message HardwareTopologyMetadata {
  // Platform name, e.g., "TPU", "CUDA", "Host".
  string platform_name = 1;
  // Device model or microarchitecture, e.g., "v5p", "v6e", "H100", "B200".
  string device_model = 2;
  // Total accelerator device count.
  int32 num_devices = 3;
  // Multi-dimensional topology mesh shape, e.g., [2, 2, 1] or [4, 4, 4].
  repeated int32 mesh_shape = 4;
}
