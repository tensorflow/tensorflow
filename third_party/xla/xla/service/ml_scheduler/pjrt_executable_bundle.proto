syntax = "proto3";

package xla.pjrt;

import "xla/service/ml_scheduler/hardware_topology.proto";
import "xla/xla.proto";
import "xla/xla_data.proto";

// Self-contained static AOT compilation artifact.
// Encapsulates the serialized executable binary bytes, hardware target
// topology, inline sample inputs, and compiler debug options.
message PjRtExecutableBundleProto {
  // 128-bit SHA-256 fingerprint of the module.
  string hlo_fingerprint = 1;

  // Human-readable name of the module for reporting and dashboard indexing.
  string module_name = 2;

  // Target hardware environment metadata.
  xla.ml_scheduler.HardwareTopologyMetadata hardware_topology = 3;

  // Serialized executable binary bytes produced by the AOT compiler backend.
  // Can be directly deserialized via `PjRtClient::LoadSerializedExecutable`.
  bytes serialized_executable = 4;

  // Inline input buffer literals used for verification and benchmarking.
  repeated xla.LiteralProto inline_inputs = 5;

  // Canonical XLA compiler debug options and flags used during compilation.
  xla.DebugOptions debug_options = 6;
}
