syntax = "proto3";

package xla.emitters;

import "xla/service/buffer_assignment.proto";
import "xla/shape_util.proto";
import "xla/xla_data.proto";

message KernelArgumentProto {
  xla.ShapeProto shape = 1;
  optional xla.buffer_assignment.BufferAllocationSliceProto slice = 2;
  bool aliased = 3;
  int64 alignment = 4;
  bool written = 5;
  bool invariant = 6;
  int64 slice_index = 7;
}

message KernelArgumentsProto {
  message ArgumentPositionsProto {
    message ResultPositionProto {
      xla.ShapeIndexProto shape_index = 1;
      int64 position = 2;
    }

    repeated int64 operands = 1;
    repeated ResultPositionProto results = 2;
  }

  repeated KernelArgumentProto args = 1;
  optional ArgumentPositionsProto positions = 2;
}
