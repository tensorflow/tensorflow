name: TensorFlow PR Review Agent

on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.repository == 'tensorflow/tensorflow' && github.event.label.name == 'Agent Review'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pr_review_agent

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch PR Head Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          AUTH_HEADER=$(printf "x-access-token:%s" "${GITHUB_TOKEN}" | base64 | tr -d '\n')
          echo "::add-mask::${AUTH_HEADER}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${AUTH_HEADER}" \
            fetch --no-tags origin "${PR_HEAD_SHA}" --depth=1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TensorFlow PR Review Agent
        env:
          PYTHONPATH: ${{ github.workspace }}/pr_review_agent
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.API_NEEDS_REVIEW }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INTERACTIVE: 0
        run: python -m agent.main
