syntax = "proto3";

package tensorflow;

// Proto representation of `tensorflow::RequestCost`.
message RequestCostProto {
  // A cost entry broken down by named dimensions.
  // Values are in microseconds.
  message StructuredCost {
    map<string, double> dimensions = 1;
  }

  // A metric entry carrying an array of doubles or an array of byte strings.
  message StructuredMetric {
    // Exactly one of the following fields will be set.
    repeated double double_values = 1;
    repeated bytes bytes_values = 2;
  }

  // Metrics of a batch that processes this rpc request.
  message BatchMetrics {
    // Size of the batch.
    int64 processed_size = 1;
    // In this batch, input size from this rpc request.
    int64 input_size = 2;
    // In this batch, the padding amount.
    int64 padding_size = 3;
    // Costs for processing this batch in microseconds.
    map<string, double> batch_costs = 4;
  }

  // Accumulated costs in microseconds.
  map<string, double> costs = 1;

  // Accumulated structured costs in microseconds, keyed by cost type name.
  map<string, StructuredCost> structured_costs = 2;

  // User-defined metrics.
  map<string, double> metrics = 3;

  // User-defined structured metrics.
  map<string, StructuredMetric> structured_metrics = 4;

  // Metrics of batches that process this rpc request.
  repeated BatchMetrics batch_metrics = 5;
}
